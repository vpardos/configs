# foot configuration
[main]
#include=~/.config/foot/dracula-theme/dracula
# Dimension settings (Note: foot handles dimensions via command line or compositor rules)
initial-window-size-pixels = 1000x800
font = JetBrainsMono Nerd Font:size=11:style=Medium
pad = 0x0

[colors]
alpha=1
background=000000
#foreground=A7B4CB

#regular0=000000  # black
#regular1=ff5555  # red
#regular2=50fa7b  # green
#regular3=f1fa8c  # yellow
#regular4=bd93f9  # blue
#regular5=ff79c6  # magenta
#regular6=8be9fd  # cyan
#regular7=bbbbbb  # white
#regular7=A7B4CB

#olors]
# alpha=1.0
# alpha-mode=default # Can be `default`, `matching` or `all`

# flash=7f7f00
# flash-alpha=0.5
# alpha=1.0
# background=282a36
foreground=f8f8f2

## Normal/regular colors (color palette 0-7)
regular0=21222c
regular1=ff5555
regular2=50fa7b
regular3=f1fa8c
regular4=bd93f9
regular5=ff79c6
regular6=8be9fd
regular7=f8f8f2

## Bright colors (color palette 8-15)
#bright0=6272a4   # bright black
#bright1=ff6e6e   # bright red
#bright2=69ff94   # bright green
#bright3=ffffa5   # bright yellow
#bright4=d6acff   # bright blue
#bright5=ff92df   # bright magenta
#bright6=a4ffff   # bright cyan
#bright7=ffffff   # bright white

[csd]
preferred = none
size = 0
